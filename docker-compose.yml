# Poker Night Leaderboard — Docker Compose
#
# The app binds to the host's private IP via HOST_BIND_IP (from .env, which
# is NOT committed). Public access happens exclusively through the Cloudflare
# tunnel, so no public ports are ever open. Default 127.0.0.1 = local-only.
services:
  app:
    build: .
    image: poker-night-leaderboard:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:8787:8787"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
