# Deploy: runs on the org's self-hosted ARM runner (***REMOVED***, Oracle
# always-free). Only triggers on pushes to main — fork PRs can never run
# this job. The .env and data directory live on the host at /srv/poker and
# are never stored in this repository.
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, ARM64]
    if: github.repository == 'org-ratabayev/poker-night-leaderboard'
    steps:
      - uses: actions/checkout@v4

      - name: Update app on the ARM host
        run: |
          set -euo pipefail
          APP_DIR=/srv/poker
          sudo mkdir -p "$APP_DIR"
          sudo rm -rf "$APP_DIR/src" "$APP_DIR/static"
          sudo cp -r src static package.json Dockerfile docker-compose.yml "$APP_DIR/"
          cd "$APP_DIR"
          sudo docker compose up -d --build

      - name: Verify health
        run: |
          sleep 6
          curl -fsS http://127.0.0.1:8787/api/health
