---
# Bootstrap / redeploy the Poker Night Leaderboard on the ARM host.
#
# Usage (from deploy/ansible/):
#   ansible-playbook -i inventory.ini playbook.yml --ask-vault-pass
#
# Secrets (.env) are provided via group_vars/all/vault.yml (ansible-vault).
# The first run creates the app directory, writes .env from the vault, and
# starts the container. Later runs just refresh code and restart.
- name: Deploy poker-night-leaderboard
  hosts: arm
  become: true
  vars:
    app_dir: /srv/poker
    runner_user: ubuntu

  tasks:
    - name: Create app directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ runner_user }}"
        group: "{{ runner_user }}"
        mode: "0755"

    - name: Write .env (secrets from vault)
      ansible.builtin.copy:
        content: |
          PORT={{ app_port | default(8787) }}
          DATA_DIR=/data
          PUBLIC_URL={{ app_public_url }}
          SESSION_SECRET={{ session_secret }}
          INVITE_CODE={{ invite_code }}
          POINTS_TABLE={{ points_table | default('100,75,55,40,30,20,12,8,5,3') }}
        dest: "{{ app_dir }}/.env"
        owner: "{{ runner_user }}"
        group: "{{ runner_user }}"
        mode: "0600"

    - name: Copy application files
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ app_dir }}/"
        owner: "{{ runner_user }}"
        group: "{{ runner_user }}"
      loop:
        - ../../Dockerfile
        - ../../docker-compose.yml
        - ../../package.json
      # src/ and static/ use synchronize for directory trees
    - name: Sync src directory
      ansible.builtin.synchronize:
        src: ../../src/
        dest: "{{ app_dir }}/src/"
        delete: true

    - name: Sync static directory
      ansible.builtin.synchronize:
        src: ../../static/
        dest: "{{ app_dir }}/static/"
        delete: true

    - name: Start application via Docker Compose
      ansible.builtin.shell:
        cmd: docker compose up -d --build
        chdir: "{{ app_dir }}"
      register: compose_out
      changed_when: "'Started' in compose_out.stdout or 'Creating' in compose_out.stdout or 'Built' in compose_out.stdout"

    - name: Wait for health endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8787/api/health
        status_code: 200
      retries: 10
      delay: 3
